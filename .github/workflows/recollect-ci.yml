name: Recollect checks

on:
  push:
    branches: ['enhancement/**', 'feature/**', 'feat/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: recollect-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub workflow syntax and expression contexts
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  types-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recollect
          POSTGRES_PASSWORD: recollect
          POSTGRES_DB: recollect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recollect -d recollect_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://recollect:recollect@127.0.0.1:5432/recollect_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/test-release-pipeline.mjs
      - run: node --test scripts/test-release-metadata.mjs
      - run: node --test scripts/test-release-policy.mjs
      - run: node --test scripts/test-release-notifications.mjs
      - run: node --test scripts/test-start-backend.mjs

  expo-bundle-and-native-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo install --check
        working-directory: apps/mobile
      - run: npx expo export --platform ios
        working-directory: apps/mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: node scripts/check-native-config.mjs
      - run: node scripts/check-release-fingerprint.mjs

  native-recovery-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node apps/mobile/modules/legacy-storage/verify-models.cjs
      - run: swift test --package-path apps/mobile/modules/legacy-storage
      - name: Typecheck Home Screen and Control Center widgets
        run: |
          xcrun swiftc -typecheck -parse-as-library \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios18.4-simulator \
            apps/mobile/modules/recollect-widget/ios/WidgetSnapshot.swift \
            apps/mobile/modules/recollect-widget/widget/CognitionCuratorWidget.swift
