name: Recollect main and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Explicit release type for manual releases or direct main pushes
        type: choice
        options: [ota, native]
        required: true

permissions:
  contents: read

# Keep deployments ordered. Do not cancel a run while an app release is in progress.
concurrency:
  group: recollect-main-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/recollect-ci.yml

  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.policy.outputs.plan }}
      release_type: ${{ steps.policy.outputs.release_type }}
      release_version: ${{ steps.policy.outputs.release_version }}
      already_released: ${{ steps.policy.outputs.already_released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve merged branch and next release version
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_PLAN_FILE: ${{ runner.temp }}/recollect-release-plan.json
        run: node scripts/release-policy.mjs prepare

  release:
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.already_released != 'true'
    needs: [checks, plan]
    permissions:
      contents: write
    runs-on: ${{ needs.plan.outputs.release_type == 'native' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 180
    environment: main
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      API_URL: ${{ vars.API_URL }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
      RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
      RELEASE_PLAN_JSON: ${{ needs.plan.outputs.plan }}
      RELEASE_PLAN_FILE: /tmp/recollect-release-plan.json
      LOCAL_NATIVE_BUILD: 'true'
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EXPO_PUBLIC_ENABLE_DEV_AUTH: 'false'
      SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select Xcode 26.2 and verify Swift
        if: needs.plan.outputs.release_type == 'native'
        run: |
          xcode_developer_dir=/Applications/Xcode_26.2.app/Contents/Developer
          test -d "$xcode_developer_dir"
          sudo xcode-select --switch "$xcode_developer_dir"
          echo "DEVELOPER_DIR=$xcode_developer_dir" >> "$GITHUB_ENV"
          xcodebuild -version
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const output = execFileSync('xcrun', ['swift', '--version'], { encoding: 'utf8' });
          const match = output.match(/Swift version (\d+)\.(\d+)/);
          if (!match || Number(match[1]) < 6 || (Number(match[1]) === 6 && Number(match[2]) < 2)) {
            throw new Error('Expo native modules require Swift 6.2 or later.');
          }
          console.log(output.trim());
          JS
      - name: Apply release and native versions
        run: node scripts/release-policy.mjs hydrate
      - name: Stamp the app release
        id: metadata
        run: node scripts/release-pipeline.mjs prepare-release
      - name: Announce the release start
        continue-on-error: true
        run: node scripts/release-notifications.mjs start
      - run: node scripts/release-pipeline.mjs validate
      - run: npm ci
      - run: npm install --global eas-cli@24.12.1
      - name: Set the stable API address for the app
        working-directory: apps/mobile
        run: |
          eas env:set preview --name EXPO_PUBLIC_API_URL --value "$API_URL" --visibility plaintext --scope project --non-interactive
          eas env:set preview --name EXPO_PUBLIC_ENABLE_DEV_AUTH --value false --visibility plaintext --scope project --non-interactive
      - name: Release OTA or build and submit to TestFlight
        id: delivery
        env:
          RELEASE_ID: ${{ steps.metadata.outputs.release_id }}
        run: node scripts/release-delivery.mjs
      - name: Record the successfully delivered version
        run: node scripts/release-policy.mjs record
    outputs:
      delivery_result: ${{ steps.delivery.outcome }}

  report:
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.already_released != 'true'
    needs: [plan, checks, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Report the final release status
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
          RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
          RELEASE_RESULT: ${{ needs.release.result }}
          DELIVERY_RESULT: ${{ needs.release.outputs.delivery_result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: node scripts/release-notifications.mjs complete
