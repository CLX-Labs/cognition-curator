name: Recollect staging and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_native:
        description: Build a fresh TestFlight binary even if the native fingerprint matches
        type: boolean
        default: false

permissions:
  contents: read

# Keep deployments ordered. Do not cancel a run while it is changing the database.
concurrency:
  group: recollect-main-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/recollect-ci.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    env:
      CI: '1'
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      FORCE_NATIVE: ${{ inputs.force_native || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Stamp the app release
        id: metadata
        run: node scripts/release-pipeline.mjs prepare-release
      - run: node scripts/release-pipeline.mjs validate
      - run: npm ci
      - run: npm install --global @railway/cli@5.64.2 eas-cli@24.12.1
      - name: Deploy API and worker, then verify API health
        run: node scripts/release-pipeline.mjs deploy
      - name: Set the stable API address for the app
        working-directory: apps/mobile
        run: |
          node ../../scripts/release-pipeline.mjs configure-app
          eas env:set preview --name EXPO_PUBLIC_API_URL --value "$STAGING_API_URL" --visibility plaintext --scope project --non-interactive
          eas env:set preview --name EXPO_PUBLIC_ENABLE_DEV_AUTH --value false --visibility plaintext --scope project --non-interactive
      - name: Release OTA or build and submit to TestFlight
        working-directory: apps/mobile
        run: |
          eas workflow:run .eas/workflows/testflight-release.yml \
            --input force_native="$FORCE_NATIVE" --input release_sha="$GITHUB_SHA" \
            --input release_id="${{ steps.metadata.outputs.release_id }}" \
            --non-interactive --wait
