name: TestFlight release or OTA update

# GitHub invokes this after the app checks succeed.
# No direct push trigger: that would duplicate the GitHub app release trigger.
on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options: [ota, native]
        required: true
      release_version:
        type: string
        required: true
      release_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true

defaults:
  tools:
    node: '24.21.0'

jobs:
  fingerprint:
    type: fingerprint
    environment: preview
  compatible_build:
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: testflight
      channel: testflight
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true
  native_build:
    needs: [compatible_build]
    if: ${{ inputs.release_type == 'native' }}
    type: build
    params:
      platform: ios
      profile: testflight
      message: ${{ inputs.release_version }} · ${{ inputs.release_id }} · ${{ inputs.release_sha }}
  submit_testflight:
    needs: [native_build]
    type: testflight
    params:
      build_id: ${{ needs.native_build.outputs.build_id }}
      profile: testflight
      changelog: ${{ inputs.release_version }} · ${{ inputs.release_id }} · ${{ inputs.release_sha }}
      submit_beta_review: false
  incompatible_ota:
    needs: [compatible_build]
    if: ${{ inputs.release_type == 'ota' && !needs.compatible_build.outputs.build_id }}
    runs_on: linux-medium
    steps:
      - run: |
          echo "No matching TestFlight runtime. Native changes must merge from feature/*, or manually release as native."
          exit 1
  ota_update:
    needs: [compatible_build]
    if: ${{ inputs.release_type == 'ota' && needs.compatible_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      platform: ios
      channel: testflight
      message: ${{ inputs.release_version }} · ${{ inputs.release_id }} · ${{ inputs.release_sha }}
