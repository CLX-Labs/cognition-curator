services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recollect
      POSTGRES_PASSWORD: recollect
      POSTGRES_DB: recollect
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - recollect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recollect -d recollect']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  recollect-postgres:
