# The existing service follows main from the repository root. The schemas below
# are additive and do not import, rewrite, or remove the legacy public tables.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["node --import=tsx scripts/setup-backend.mjs"]
startCommand = "node scripts/start-backend.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
