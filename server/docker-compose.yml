services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cognition_curator_dev
      POSTGRES_USER: cognition_user
      POSTGRES_PASSWORD: cognition_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognition_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
